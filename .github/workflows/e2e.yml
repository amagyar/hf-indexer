name: E2E Tests

on:
  schedule:
    # Smoke-test the live site every 6 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL to test'
        required: false
        default: 'https://amagyar.github.io/hf-indexer/'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          SITE_URL: ${{ github.event.inputs.site_url || 'https://amagyar.github.io/hf-indexer/' }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
